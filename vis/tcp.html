<script>
(function(){
'use strict';

/* ============================ 三次握手数据 ============================ */
var HANDSHAKE_STEPS = [
  {from:'c',to:'s',type:'SYN',seq:100,ack:null, cs:'SYN_SENT', ss:'LISTEN', line:1,
   desc:'客户端发起连接：发送 <b>SYN</b>，seq=x=100，客户端进入 SYN_SENT 状态。'},
  {from:'s',to:'c',type:'SYN+ACK',seq:200,ack:101, cs:'SYN_SENT', ss:'SYN_RCVD', line:2,
   desc:'服务端收到 SYN，回应 <b>SYN+ACK</b>：seq=y=200，ack=x+1=101，服务端进入 SYN_RCVD 状态。'},
  {from:'c',to:'s',type:'ACK',seq:101,ack:201, cs:'ESTABLISHED', ss:'ESTABLISHED', line:3,
   desc:'客户端收到 SYN+ACK，回应 <b>ACK</b>：ack=y+1=201，双方进入 ESTABLISHED，连接建立完成。'}
];
var HS_PSEUDO = [
  '// TCP 三次握手',
  '客户端 → 服务端：SYN, seq=x （CLOSED→SYN_SENT）',
  '服务端 → 客户端：SYN+ACK, seq=y, ack=x+1 （LISTEN→SYN_RCVD）',
  '客户端 → 服务端：ACK, ack=y+1 （双方→ESTABLISHED）'
];

/* ============================ 滑动窗口数据 ============================ */
function genWindow(win, total){
  var steps = [];
  var base = 0, next = 0;
  var sent = [];  // 已发送未确认
  var acked = []; // 已确认
  function snapshot(){
    return {base:base, win:win, sent:sent.slice(), acked:acked.slice(), total:total};
  }
  // 初始：发送窗口内全部段
  for(next=0; next<Math.min(win,total); next++) sent.push(next);
  steps.push(Object.assign(snapshot(), {line:1, ack:null,
    desc:'发送方把窗口内 seq='+sent.join('、')+' 共 '+sent.length+' 段全部发出（窗口 '+win+'）。'}));

  var limit = 0;
  while(acked.length < total && limit < 100){
    // 收到 ack = base
    var k = base;
    var a = sent[0]; // 最早未确认的段被确认
    acked.push(a);
    sent.shift();
    steps.push(Object.assign(snapshot(), {line:2, ack:k, base:k+1,
      desc:'收到 ack='+a+'，累积确认 seq≤'+a+' 的段，窗口右移 base='+(a+1)+'。'}));
    // 发送新段
    if(next < total){
      sent.push(next); next++;
      steps.push(Object.assign(snapshot(), {line:3, ack:null,
        desc:'新段 seq='+(next-1)+' 进入窗口并发出。'}));
    }
    base = acked.length;
    limit++;
  }
  steps.push(Object.assign(snapshot(), {line:4, ack:null,
    desc:'所有段均已确认，发送完成。'}));
  return steps;
}
var WIN_PSEUDO = [
  '// 滑动窗口（累积确认 / 连续 ARQ）',
  '发送方把窗口 [base, base+win) 内全部发出',
  '收到 ack=k：累积确认，窗口右移 base=k+1',
  '新进入窗口的段随即发出',
  '// 全部段确认完毕'
];

/* ============================ 状态 ============================ */
var TABS = [
  {key:'hs', name:'三次握手', note:'<b>三次握手</b>　客户端主动发起 SYN，服务端回 SYN+ACK，客户端再回 ACK。<br><b>考点：</b>①为什么是三次不是两次——防止<u>已失效的连接请求</u>突然到达服务端导致服务端误开连接；②SYN 报文占用一个序号（故确认号 = seq+1）；③双方各维护一个 ISN（初始序列号），此处取 x=100、y=200 便于演示。'},
  {key:'win', name:'滑动窗口', note:'<b>滑动窗口</b>　发送方在未收到确认前可连续发送窗口内的多个段（连续 ARQ），接收方用<u>累积确认</u>（ack=k 表示 k 及之前全部收到）。<br><b>考点：</b>窗口大小决定「在途」数据上限，与往返时延 RTT 共同决定吞吐；接收方窗口用于流量控制（rwnd 字段）。'}
];
var cur = TABS[0];
var steps = [], idx = 0, timer = null;

function win(){ return Math.max(2, Math.min(6, +document.getElementById('win').value || 4)); }

function rebuild(){
  steps = (cur.key === 'hs') ? HANDSHAKE_STEPS : genWindow(win(), 12);
  idx = 0;
  renderCode(); render();
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderCode(){
  var lines = (cur.key === 'hs') ? HS_PSEUDO : WIN_PSEUDO;
  var curLine = steps[idx] ? steps[idx].line : -1;
  var html = '';
  for(var i=0;i<lines.length;i++){
    var cls = (i === curLine) ? 'ln hl' : 'ln';
    html += '<span class="'+cls+'">'+esc(lines[i])+'</span>';
  }
  document.getElementById('code').innerHTML = html;
}

/* ============================ 渲染：状态 ============================ */
function renderStates(s){
  if(cur.key === 'hs'){
    document.getElementById('states').innerHTML =
      '<div class="state-box client"><div class="k">客户端</div><div class="v">'+s.cs+'</div></div>'+
      '<div class="state-box server"><div class="k">服务端</div><div class="v">'+s.ss+'</div></div>';
    document.getElementById('legend').innerHTML =
      '<span><i style="background:var(--client)"></i>客户端 → 服务端</span>'+
      '<span><i style="background:var(--server)"></i>服务端 → 客户端</span>';
  } else {
    document.getElementById('states').innerHTML =
      '<div class="state-box client"><div class="k">窗口左边界 base</div><div class="v">'+s.base+'</div></div>'+
      '<div class="state-box server"><div class="k">窗口大小 win</div><div class="v">'+s.win+'</div></div>';
    document.getElementById('legend').innerHTML =
      '<span><i style="background:var(--acked)"></i>已确认</span>'+
      '<span><i style="background:var(--sent)"></i>已发送未确认</span>'+
      '<span><i style="background:var(--inwin)"></i>窗口内可发</span>'+
      '<span><i style="background:var(--outside)"></i>窗口外</span>';
  }
}

/* ============================ 渲染：Canvas ============================ */
function renderHs(s){
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  var cx = W*0.30, sx = W*0.70;
  var topY = 60, botY = H - 40;
  var shown = idx + 1; // 已画箭头数

  // 两根竖线
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx, botY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx, topY); ctx.lineTo(sx, botY); ctx.stroke();

  // 端点标签
  var cs = (idx>=0) ? steps[idx].cs : 'CLOSED';
  var ss = (idx>=0) ? steps[idx].ss : 'LISTEN';
  ctx.fillStyle = '#1f2937'; ctx.font = 'bold 14px -apple-system,sans-serif'; ctx.textAlign='center';
  ctx.fillText('客户端', cx, 28);
  ctx.fillText('服务端', sx, 28);
  ctx.fillStyle = '#2563eb'; ctx.font = '12px -apple-system,sans-serif';
  ctx.fillText(cs, cx, 46);
  ctx.fillStyle = '#8b5cf6';
  ctx.fillText(ss, sx, 46);

  // 箭头
  var stepGap = (botY - topY) / Math.max(1, HANDSHAKE_STEPS.length);
  for(var i=0;i<HANDSHAKE_STEPS.length;i++){
    var s = HANDSHAKE_STEPS[i];
    var y = topY + stepGap*(i+0.5);
    var active = i < shown;
    var from = s.from==='c' ? cx : sx;
    var to = s.from==='c' ? sx : cx;
    var color = s.from==='c' ? '#3b82f6' : '#8b5cf6';
    ctx.globalAlpha = active ? 1 : 0.25;
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(from, y); ctx.lineTo(to, y); ctx.stroke();
    // 箭头
    var dir = s.from==='c' ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(to, y); ctx.lineTo(to - dir*8, y-5); ctx.lineTo(to - dir*8, y+5); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    // 标签
    ctx.fillStyle = '#1f2937'; ctx.font = 'bold 13px -apple-system,sans-serif'; ctx.textAlign='center';
    var midX = (from+to)/2;
    ctx.fillText(s.type, midX, y-8);
    ctx.fillStyle = '#6b7280'; ctx.font = '11px -apple-system,sans-serif';
    var seqStr = s.ack==null ? ('seq='+s.seq) : ('seq='+s.seq+', ack='+s.ack);
    ctx.fillText(seqStr, midX, y+16);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function renderWin(s){
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  var total = s.total;
  var padL = 40, padR = 40, boxTop = H*0.35, boxH = 56;
  var cellW = (W - padL - padR) / total;
  var cellH = boxH;

  ctx.font = '11px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  for(var i=0;i<total;i++){
    var x = padL + i*cellW;
    var color;
    if(s.acked.indexOf(i) >= 0) color = '#22c55e';
    else if(s.sent.indexOf(i) >= 0) color = '#f59e0b';
    else if(i >= s.base && i < s.base + s.win) color = '#60a5fa';
    else color = '#e5e7eb';
    ctx.fillStyle = color;
    roundRect(x, boxTop, cellW-2, cellH, 4); ctx.fill();
    ctx.fillStyle = (color==='#e5e7eb') ? '#9ca3af' : '#fff';
    ctx.font = 'bold 13px -apple-system,sans-serif';
    ctx.fillText(i, x + (cellW-2)/2, boxTop + cellH/2 + 4);
    ctx.fillStyle = '#6b7280'; ctx.font = '10px -apple-system,sans-serif';
    ctx.fillText(i, x + (cellW-2)/2, boxTop + cellH + 16);
  }

  // 窗口框
  var wx = padL + s.base*cellW;
  var ww = s.win*cellW;
  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.5;
  ctx.setLineDash([5,4]);
  ctx.strokeRect(wx, boxTop-6, ww, cellH+12);
  ctx.setLineDash([]);
  ctx.fillStyle = '#2563eb'; ctx.font = 'bold 12px -apple-system,sans-serif';
  ctx.fillText('滑动窗口 ['+s.base+', '+(s.base+s.win)+')', wx + ww/2, boxTop-14);

  // 发送方/接收方示意
  ctx.fillStyle = '#6b7280'; ctx.font = '12px -apple-system,sans-serif';
  ctx.fillText('发送方 · 序号空间', W/2, 30);
  ctx.textAlign = 'left';
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

function render(){
  var s = steps[idx]; if(!s) return;
  if(cur.key === 'hs') renderHs(s); else renderWin(s);
  renderStates(s);
  document.getElementById('desc').innerHTML = '<b>'+(cur.key==='hs'?'第 '+(idx+1)+' 步':'')+'</b>'+esc(s.desc);
  document.getElementById('bar').style.width = (steps.length<2?0:(idx/(steps.length-1)*100))+'%';
  document.getElementById('btnPrev').disabled = (idx===0);
  document.getElementById('btnNext').disabled = (idx>=steps.length-1);
}

/* ============================ 播放控制 ============================ */
function play(){
  if(timer) return;
  if(idx >= steps.length-1) idx = 0;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  var sp = +document.getElementById('speed').value;
  var delay = Math.round(900/sp);
  timer = setInterval(function(){
    if(idx >= steps.length-1){ stop(); return; }
    idx++; renderCode(); render();
  }, delay);
}
function stop(){ if(timer){ clearInterval(timer); timer=null; } document.getElementById('btnPlay').textContent='▶ 播放'; }

/* ============================ 事件 ============================ */
var tabsBox = document.getElementById('tabs');
TABS.forEach(function(tb){
  var b = document.createElement('button');
  b.className = 'tab' + (tb===cur ? ' active' : '');
  b.textContent = tb.name;
  b.onclick = function(){
    stop();
    cur = tb;
    [].forEach.call(tabsBox.children, function(c){ c.className='tab'; });
    b.className = 'tab active';
    document.getElementById('winBox').style.display = (tb.key==='win') ? 'flex' : 'none';
    document.getElementById('note').innerHTML = tb.note;
    rebuild();
  };
  tabsBox.appendChild(b);
});

document.getElementById('btnPlay').onclick = function(){ timer?stop():play(); };
document.getElementById('btnNext').onclick = function(){ stop(); if(idx<steps.length-1){ idx++; renderCode(); render(); } };
document.getElementById('btnPrev').onclick = function(){ stop(); if(idx>0){ idx--; renderCode(); render(); } };
document.getElementById('btnReset').onclick = function(){ stop(); idx=0; renderCode(); render(); };
document.getElementById('speed').oninput = function(){
  document.getElementById('speedVal').textContent = this.value+'×';
  if(timer){ stop(); play(); }
};
document.getElementById('win').onchange = function(){ stop(); rebuild(); };
window.addEventListener('resize', function(){ render(); });

/* 初始化 */
document.getElementById('note').innerHTML = cur.note;
rebuild();
})();
</script>
